<!doctype html>
<html><head><meta charset="utf-8">
<style>
html,body{margin:0;background:#120424}
#root{position:relative;width:1080px;height:1920px;overflow:hidden;background:#120424;font-family:'Roboto',sans-serif}
#t{position:absolute;top:800px;width:100%;text-align:center;font-size:120px;font-weight:900;color:#fff;opacity:0}
</style></head>
<body>
<div id="root" data-composition-id="root" data-width="1080" data-height="1920" data-start="0" data-duration="3">
  <div id="t">CORTIZADAS</div>
</div>
<script src="gsap.min.js"></script>
<script>
const tl = gsap.timeline({paused:true});
tl.fromTo("#t",{opacity:0,scale:0.4},{opacity:1,scale:1,duration:0.5,ease:"back.out(2)"},0);
tl.to("#t",{rotation:-4,duration:0.2,yoyo:true,repeat:5},0.6);
window.__timelines = window.__timelines || {}; window.__timelines["root"] = tl;
</script>
</body></html>
